<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>唯一</title>
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <div class="wrap">
    <div class="player">
      <img class="cover-img" src="covers/6.jpeg" alt="曲目6封面">
      <h2>唯一</h2>
      <p class="album">邓紫棋</p>
      <audio id="audio" preload="metadata" src="audio/6.mp3"></audio>
      <button id="playBtn" class="btn-play" aria-label="播放或暂停">▶</button>
      <div class="progress-row">
        <span id="current" class="time">0:00</span>
        <input type="range" id="progress" class="progress" min="0" max="0" step="1" value="0">
        <span id="total" class="time right">--:--</span>
      </div>
      <a class="btn-download" href="audio/6.flac" download="唯一.flac">⬇ 下载</a>
    </div>
    <a class="back" href="index.html">← 返回曲目列表</a>
    <footer class="footer">Just for Cindy Gao.</footer>
  </div>
  <script src="js/player.js?v=2"></script>
</body>
</html>
