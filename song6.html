<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曲目6 · 音频专辑</title>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <div class="wrap">
    <div class="player">
      <div class="cover">♪</div>
      <h2>曲目6</h2>
      <p class="album">音频专辑</p>
      <audio id="audio" preload="metadata" src="audio/6.mp3"></audio>
      <button id="playBtn" class="btn-play" aria-label="播放或暂停">▶</button>
      <div class="progress-row">
        <span id="current" class="time">0:00</span>
        <input type="range" id="progress" class="progress" min="0" max="0" step="1" value="0">
        <span id="total" class="time right">--:--</span>
      </div>
      <a class="btn-download" href="audio/6.mp3" download="曲目6.mp3">⬇ 下载</a>
    </div>
    <a class="back" href="index.html">← 返回曲目列表</a>
    <footer class="footer">在线音频专辑</footer>
  </div>
  <script src="js/player.js"></script>

</html>
