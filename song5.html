<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多远都要在一起</title>
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <div class="wrap">
    <div class="player">
      <img class="cover-img" src="covers/5.jpeg" alt="曲目5封面">
      <h2>多远都要在一起</h2>
      <p class="album">邓紫棋</p>

      <!-- 隐藏的音频元素 -->
      <audio id="audio" preload="auto" src="audio/5.mp3"></audio>

      <!-- 播放/暂停按钮 -->
      <button id="playBtn" class="btn-play" aria-label="播放或暂停">▶</button>

      <!-- 进度条 -->
      <div class="progress-row">
        <span id="current" class="time">0:00</span>
        <div id="progress" class="progress-custom"><div id="progressFill" class="progress-fill"></div><div id="progressThumb" class="progress-thumb"></div></div>
        <span id="total" class="time right">--:--</span>
      </div>

      <!-- 下载按钮 -->
      <a class="btn-download" href="audio/5.flac" download="多远都要在一起.flac">⬇ 下载</a>
    </div>

    <a class="back" href="index.html">← 返回曲目列表</a>
    <footer class="footer">Just for Cindy Gao.</footer>
  </div>
  <script src="js/player.js?v=6"></script>
</body>
</html>
